name: Contributor claims

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  coordinate:
    if: >-
      github.event.issue.number == 4 && !github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, '/claim') ||
       startsWith(github.event.comment.body, '/unclaim') ||
       startsWith(github.event.comment.body, '/progress'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: framelab-coordination-4
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Process coordination command
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/contributor_claims.py
