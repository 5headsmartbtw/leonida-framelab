name: Bug / compatibility report
description: Report a reproducible contract, rendering or compatibility problem
title: "[Bug] "
body:
  - type: textarea
    attributes:
      label: Environment
      description: GPU, OS, driver, API, SDK/runtime and project commit
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Exact command, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: Use sanitized logs or an original synthetic scene. GTA VI Game Files, game-derived captures or dumps, and links or attachments distributing them are strictly prohibited. Do not attach NVIDIA binaries or kernels.
