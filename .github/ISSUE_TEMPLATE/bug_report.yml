name: Bug / compatibility report
description: Report a reproducible contract, rendering or compatibility problem
title: "[Bug] "
body:
  - type: textarea
    attributes:
      label: Environment
      description: GPU, OS, driver, API, SDK/runtime and project commit
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Exact command, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: Sanitized text logs or your own synthetic scene; no game data, SDK binaries or kernel dumps
